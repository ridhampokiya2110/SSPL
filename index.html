<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>SSPL 2026 Auction</title>  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(180deg, #5a0000, #8b0000);
      color: white;
      text-align: center;
    }

    h1 {
      font-size: 46px;
      color: #ffd700;
      margin: 20px 0 5px;
    }

    .subtitle {
      font-size: 18px;
      color: #ffffff;
      margin-bottom: 15px;
    }

    .teams {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      padding: 15px;
    }

    .team {
      background: rgba(255,255,255,0.08);
      padding: 15px;
      border-radius: 15px;
      width: 150px;
      border: 2px solid rgba(255,255,255,0.2);
      transition: 0.3s;
    }

    .team:hover {
      transform: scale(1.08);
      box-shadow: 0 0 15px #ffd700;
    }

    .team-logo {
      width: 70px;
      height: 70px;
      cursor: pointer;
    }

    .selected {
      border: 3px solid #ffd700;
    }

    .players {
      font-size: 13px;
      margin-top: 8px;
      max-height: 100px;
      overflow-y: auto;
      text-align: left;
    }

    .unsold-btn {
      margin-left: 6px;
      background: #ffd700;
      color: black;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      padding: 2px 6px;
    }

    .auction-box {
      margin-top: 25px;
      background: rgba(0,0,0,0.4);
      padding: 20px;
      border-radius: 15px;
      width: 350px;
      margin-left: auto;
      margin-right: auto;
      border: 1px solid #ffd700;
    }

    input {
      padding: 12px;
      width: 85%;
      border-radius: 10px;
      border: none;
      text-align: center;
      font-size: 16px;
    }

    .bid-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin: 20px 0;
      font-size: 20px;
    }

    .bid-btn {
      padding: 14px 18px;
      font-size: 20px;
      cursor: pointer;
      background: #ffd700;
      border: none;
      color: black;
      border-radius: 10px;
      font-weight: bold;
    }

    .bid-btn:hover {
      transform: scale(1.1);
    }

  </style></head><body><h1>SSPL 2026</h1>
<div class="subtitle">Saral & SiddhiVinayak Premier League</div><div class="teams" id="teams"></div><div class="auction-box">
  <input type="number" id="playerNumber" placeholder="Player Number">  <div class="bid-controls">
    <button class="bid-btn" onclick="decreaseBid()">-</button>
    <span id="bidDisplay">₹100000</span>
    <button class="bid-btn" onclick="increaseBid()">+</button>
  </div><button class="bid-btn" onclick="buyPlayer()">Confirm Purchase</button>

</div><script>
const BASE = 100000;
let bid = BASE;
let selectedTeam = null;

let teams = JSON.parse(localStorage.getItem("teams")) || [
  { name: "Shrewd Paltan", balance: 10000000, players: [], logo: "1.png" },
  { name: "Bajarang Mavericks", balance: 10000000, players: [], logo: "2.png" },
  { name: "Perfect Lions", balance: 10000000, players: [], logo: "6.png" },
  { name: "Smile 11", balance: 10000000, players: [], logo: "5.png" },
  { name: "Saral Strickers", balance: 10000000, players: [], logo: "3.png" },
  { name: "Karma King", balance: 10000000, players: [], logo:"4.png"}
];

function saveData() {
  localStorage.setItem("teams", JSON.stringify(teams));
}

function renderTeams() {
  const container = document.getElementById("teams");
  container.innerHTML = "";

  teams.forEach((team, i) => {
    const div = document.createElement("div");
    div.className = "team" + (selectedTeam === i ? " selected" : "");

    div.innerHTML = `
      <img src="${team.logo}" class="team-logo" onclick="selectTeam(${i})">
      <div><b>${team.name}</b></div>
      <div>₹${team.balance.toLocaleString()}</div>
      <div class="players">
        ${team.players.map((p, index) => `
          #${p.number} (₹${p.amount}) 
          <button class='unsold-btn' onclick='unsoldPlayer(${i},${index})'>Unsold</button>
        `).join("<br>")}
      </div>
    `;

    container.appendChild(div);
  });
}

function selectTeam(i) {
  selectedTeam = i;
  renderTeams();
}

function increaseBid() {
  bid += BASE;
  document.getElementById("bidDisplay").innerText = "₹" + bid;
}

function decreaseBid() {
  if (bid > BASE) {
    bid -= BASE;
    document.getElementById("bidDisplay").innerText = "₹" + bid;
  }
}

function buyPlayer() {
  const number = document.getElementById("playerNumber").value;

  if (selectedTeam === null) return alert("Select team");
  if (!number) return alert("Enter player number");

  if (teams[selectedTeam].balance < bid) return alert("Low balance");

  teams[selectedTeam].balance -= bid;
  teams[selectedTeam].players.push({ number, amount: bid });

  saveData();
  renderTeams();
}

function unsoldPlayer(teamIndex, playerIndex) {
  const player = teams[teamIndex].players[playerIndex];

  teams[teamIndex].balance += player.amount;
  teams[teamIndex].players.splice(playerIndex, 1);

  saveData();
  renderTeams();
}

renderTeams();
</script></body>
</html>
